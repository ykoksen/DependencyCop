name: dotnet package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore
        run: dotnet restore _Development/Solution.proj
      - name: Build
        run: dotnet msbuild _Development/Solution.proj /t:_Build /p:Configuration=Release
      - name: Test
        run: dotnet msbuild _Development/Solution.proj /t:_Test /p:Configuration=Release
      - name: Upload NuGet Package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: Lindhart.DependencyCop.Package/bin/Release/*.nupkg
          if-no-files-found: error
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: _Development/obj/TestResults/**/*.trx
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: _Development/obj/TestReport/
